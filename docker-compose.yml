  #     - backend
  #   networks:
  #     - studio-network

  livekit:
    image: livekit/livekit-server:latest
    container_name: livekit
    restart: unless-stopped
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    networks:
      - studio-network

  neomeet-decoder:
    build: ./gstreamer
    container_name: neomeet-decoder
    environment:
      - LIVEKIT_URL=wss://neomeet.amsolution.net.br/livekit
      - ROOM_NAME=minha-sala
      - IDENTITY=tvbox-decoder
      # - LIVEKIT_API_KEY= 
      # - LIVEKIT_API_SECRET=
    devices:
      - /dev/snd:/dev/snd # Para áudio no Linux
    restart: unless-stopped
    stdin_open: true
    tty: true

  # agent:
