services:
  postgres:
    image: postgres:15
    container_name: uespi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: uespi_connect
      POSTGRES_USER: uespi_user
      POSTGRES_PASSWORD: uespi123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - studio-network

  # backend:
  #   build: ./backend
  #   container_name: uespi-backend
