# Pipeline local/produção do Resenha.
#
# Duas camadas de configuração:
#   - `.env` (raiz, fora do controle de versão) -> só variáveis usadas pelo
#     PRÓPRIO docker-compose (senha do mysql/rabbitmq, tags de imagem, args
#     de build do frontend). Veja `.env.example`.
#   - `backend/.env` -> config da aplicação Go (SMTP, chaves, etc.), lida
#     pelos containers `api` e `worker-email` via `env_file`. Veja
#     `backend/.env.example`.
#
# DB_HOST/RABBIT_URL/LIVEKIT_URL do backend/.env apontam pra localhost (uso
# local sem Docker); dentro do compose eles são sobrescritos no bloco
# `environment:` de cada serviço para os nomes dos serviços do Docker.

services:
  mysql:
    image: mysql:8.0
    container_name: resenha-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-resenha_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-resenha}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-resenha_root}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - resenha-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: resenha-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-resenha}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-resenha_rabbit}
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # UI de administração
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - resenha-network

  livekit:
    image: livekit/livekit-server:latest
    container_name: livekit
    restart: unless-stopped
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    networks:
      - resenha-network

  # ---- API (Go) ---------------------------------------------------------
  api:
    image: ${DOCKERHUB_USERNAME}/resenha-api:${IMAGE_TAG:-latest}
    container_name: resenha-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - APP_NAME=Resenha
      - PORT=8080
      - TOKEN_KEY=${TOKEN_KEY:-change-me}
      - APP_KEY=${APP_KEY:-WEBTESTE}
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${MYSQL_DATABASE}
      - DB_USERNAME=root
      - DB_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      - RABBIT_URL=amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
      - MAIL_MAILER=smtp
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_ENCRYPTION=tls
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-Resenha}
      - VERIFICATION_SECRET=${VERIFICATION_SECRET}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - LIVEKIT_URL=ws://livekit:7880
      - UPLOAD_DIR=/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - resenha-network

  # ---- Worker de e-mail (Go) --------------------------------------------
  worker-email:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.email
    image: ${DOCKERHUB_USERNAME:-local}/resenha-worker-email:${IMAGE_TAG:-latest}
    container_name: resenha-worker-email
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      RABBIT_URL: amqp://${RABBITMQ_DEFAULT_USER:-resenha}:${RABBITMQ_DEFAULT_PASS:-resenha_rabbit}@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - resenha-network

  # ---- Frontend (React + Nginx) ------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
        VITE_APP_KEY: ${VITE_APP_KEY:-WEBTESTE}
    image: ${DOCKERHUB_USERNAME:-local}/resenha-frontend:${IMAGE_TAG:-latest}
    container_name: resenha-frontend
    restart: unless-stopped
    environment:
      - BACKEND_HOST=api
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - resenha-network

  # neomeet-decoder:
  #   Depende da pasta ./gstreamer, que não existe neste checkout (bot de
  #   decodificação de áudio pra bancada física do estúdio). Reative este
  #   serviço quando ela for adicionada ao repositório/servidor — como
  #   estava, o `build: ./gstreamer` quebrava qualquer `docker compose up`.
  #   build: ./gstreamer
  #   container_name: neomeet-decoder
  #   environment:
  #     - LIVEKIT_URL=wss://neomeet.amsolution.net.br/livekit
  #     - ROOM_NAME=minha-sala
  #     - IDENTITY=tvbox-decoder
  #   devices:
  #     - /dev/snd:/dev/snd
  #   restart: unless-stopped
  #   stdin_open: true
  #   tty: true

volumes:
  mysql_data:
  rabbitmq_data:
  uploads_data:

networks:
  resenha-network:
    driver: bridge