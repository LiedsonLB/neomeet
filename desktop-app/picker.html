<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  body { margin:0; background:#1e1f22; color:#fff; font-family:sans-serif; }
  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; padding:16px; }
  .card { cursor:pointer; border:2px solid transparent; border-radius:8px; overflow:hidden; background:#2b2d31; }
  .card.selected { border-color:#5865f2; }
  .card img { width:100%; display:block; }
  .card p { margin:6px; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .footer { display:flex; justify-content:space-between; align-items:center; padding:12px 16px; }
  label { font-size:13px; }
  button { padding:8px 16px; border:none; border-radius:6px; cursor:pointer; }
  #compartilhar { background:#5865f2; color:#fff; }
  #cancelar { background:#4e5058; color:#fff; }
</style></head>
<body>
  <div class="grid" id="grid"></div>
  <div class="footer">
    <label><input type="checkbox" id="audio" checked> Compartilhar áudio do sistema</label>
    <div>
      <button id="cancelar">Cancelar</button>
      <button id="compartilhar">Compartilhar</button>
    </div>
  </div>
  <script src="picker-renderer.js"></script>
</body></html>
