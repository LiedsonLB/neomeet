name: Deploy Resenha

on:
  push:
    branches: [ RESENHA-2 ]

jobs:

# ==========================================================================
# BUILD + PUSH DAS 3 IMAGENS (api, worker-email, frontend)
# ==========================================================================
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      # ---- API -------------------------------------------------------
      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/docker/Dockerfile.api
          push: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/resenha-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/resenha-api:${{ github.sha }}

      # ---- Worker de e-mail -------------------------------------------
      - name: Build & push worker-email
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/docker/Dockerfile.email
          push: true
          cache-from: type=gha,scope=worker-email
          cache-to: type=gha,mode=max,scope=worker-email
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/resenha-worker-email:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/resenha-worker-email:${{ github.sha }}

      # ---- Frontend -----------------------------------------------------
      - name: Build & push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_APP_KEY=${{ secrets.VITE_APP_KEY }}
            VITE_LIVEKIT_URL=wss://resenha.mooo.com/livekit
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/resenha-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/resenha-frontend:${{ github.sha }}

# ==========================================================================
# DEPLOY NO SERVIDOR (self-hosted runner)
# ==========================================================================
  deploy:
    needs: build-and-push
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      # ---- Gera backend/.env a partir dos Secrets ----------------------
      # Importante: as credenciais NÃO vão para dentro da imagem (imagens
      # de produção às vezes acabam sendo vistas por mais gente do que
      # deveriam, e nesse caso qualquer um com `docker pull` conseguiria ler
      # os segredos das camadas). Em vez disso o arquivo é escrito no disco
      # do runner e entra no container em tempo de execução via `env_file`
      # no docker-compose.yml — o efeito prático (variáveis disponíveis
      # dentro do container) é o mesmo, mas a imagem publicada no Docker Hub
      # continua "limpa".
      - name: Gerar backend/.env
        run: |
          cat > backend/.env <<EOF
          APP_NAME=Resenha
          PORT=8080
          TOKEN_KEY=${{ secrets.TOKEN_KEY }}
          APP_KEY=${{ secrets.APP_KEY }}

          DB_HOST=mysql
          DB_PORT=3306
          DB_DATABASE=${{ secrets.MYSQL_DATABASE }}
          DB_USERNAME=root
          DB_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}

          FRONTEND_URL=${{ secrets.FRONTEND_URL }}

          RABBIT_URL=amqp://${{ secrets.RABBITMQ_DEFAULT_USER }}:${{ secrets.RABBITMQ_DEFAULT_PASS }}@rabbitmq:5672/

          MAIL_MAILER=smtp
          MAIL_HOST=${{ secrets.MAIL_HOST }}
          MAIL_PORT=${{ secrets.MAIL_PORT }}
          MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
          MAIL_ENCRYPTION=tls
          MAIL_FROM_ADDRESS=${{ secrets.MAIL_FROM_ADDRESS }}
          MAIL_FROM_NAME="Resenha"
          VERIFICATION_SECRET=${{ secrets.VERIFICATION_SECRET }}

          LIVEKIT_API_KEY=${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET=${{ secrets.LIVEKIT_API_SECRET }}
          LIVEKIT_URL=wss://resenha.mooo.com/livekit
          LIVEKIT_PUBLIC_URL=wss://resenha.mooo.com/livekit

          UPLOAD_DIR=/app/uploads
          EOF

      # ---- Gera o .env de infraestrutura (variáveis do compose) --------
      - name: Gerar .env do docker-compose
        run: |
          cat > .env <<EOF
          DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG=${{ github.sha }}
          MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}
          RABBITMQ_DEFAULT_USER=${{ secrets.RABBITMQ_DEFAULT_USER }}
          RABBITMQ_DEFAULT_PASS=${{ secrets.RABBITMQ_DEFAULT_PASS }}
          VITE_API_URL=${{ secrets.VITE_API_URL }}
          VITE_APP_KEY=${{ secrets.VITE_APP_KEY }}
          EOF

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---- Sobe tudo via docker compose ---------------------------------
      # As imagens de api/worker-email/frontend já foram construídas e
      # publicadas no job anterior com a tag ${{ github.sha }}; aqui só
      # puxamos essa mesma tag (via IMAGE_TAG no .env) e recriamos os
      # containers. Sem --build: se usasse, o compose ignoraria a imagem
      # publicada e recompilaria localmente no runner.
      - name: Deploy (docker compose)
        run: |
          docker compose pull
          docker compose up -d --remove-orphans

      - name: Limpar imagens antigas
        run: docker image prune -f